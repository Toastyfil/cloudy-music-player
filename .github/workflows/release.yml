name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The bundled service has its own package.json; without this its
      # node_modules is missing from the installer and the backend dies with
      # "Cannot find package 'express'", leaving playback broken.
      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Bundle yt-dlp
        shell: bash
        run: |
          mkdir -p bin
          curl -L --fail --silent --show-error \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe \
            -o bin/yt-dlp.exe
          ./bin/yt-dlp.exe --version

      - name: Build renderer
        run: npm run build

      - name: Configure code signing
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
        run: node scripts/azure-signing.mjs

      - name: Package installer
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if node -e "process.exit(require('./package.json').build.win.azureSignOptions ? 0 : 1)"; then
            echo "::notice::Signing the installer with Azure Trusted Signing."
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          elif [ -z "$CSC_LINK" ]; then
            echo "::notice::No Windows certificate configured - building an unsigned installer."
            # An empty CSC_LINK still counts as set and breaks the signing step.
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            echo "::notice::Signing the installer with a PFX certificate."
          fi
          npx electron-builder --win --publish never

      - name: Verify bundled backend
        shell: pwsh
        run: |
          $server = "release/win-unpacked/resources/app.asar.unpacked/server"
          if (-not (Test-Path "$server/index.js")) { throw "The packaged app has no backend entrypoint." }
          if (-not (Test-Path "$server/node_modules/express/package.json")) {
            throw "The packaged backend is missing its node_modules (express)."
          }
          Write-Host "backend dependencies present"

      - name: Verify signature
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT != '' || secrets.WIN_CSC_LINK != '' }}
        run: |
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer produced." }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "$($exe.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            if ($env:SIGNING_CONFIGURED -eq 'true') { throw "Signing is configured but the installer is not signed." }
            Write-Host "::notice::Unsigned installer - no signing certificate is configured."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*-win-*.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Bundle yt-dlp
        run: |
          mkdir -p bin
          curl -L --fail --silent --show-error \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos \
            -o bin/yt-dlp
          chmod +x bin/yt-dlp
          ./bin/yt-dlp --version

      - name: Build renderer
        run: npm run build

      - name: Package DMG
        # Developer ID signing + notarization happen when the Apple secrets are
        # set; without them the DMG is unsigned rather than failed.
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::notice::No Apple certificate configured - building an unsigned DMG."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            echo "::notice::Signing with a Developer ID certificate and notarizing."
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          fi
          npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Verify signature and notarization
        env:
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
          NOTARIZED: ${{ secrets.APPLE_ID != '' }}
        run: |
          if [ "$SIGNED" != "true" ]; then
            echo "::notice::Unsigned build - nothing to verify."
            exit 0
          fi
          APP=$(find release -maxdepth 2 -name "Cloudy.app" -type d | head -1)
          echo "Checking $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp"
          if [ "$NOTARIZED" = "true" ]; then
            spctl --assess --type execute --verbose=4 "$APP"
          else
            spctl --assess --type execute --verbose=4 "$APP" || echo "::warning::Signed but not notarized - add the Apple ID secrets to clear Gatekeeper."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cloudy-macos-${{ matrix.arch }}
          # The zip carries the .app bundle the in-app updater swaps in; without
          # it macOS falls back to opening the DMG in Finder.
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux AppImage and deb
    # 22.04 on purpose: the AppImage links against the glibc of the machine that
    # built it, and ubuntu-24.04 would produce one that refuses to start on
    # anything older than Ubuntu 24.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Bundle yt-dlp
        run: |
          mkdir -p bin
          curl -L --fail --silent --show-error \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            -o bin/yt-dlp
          chmod +x bin/yt-dlp
          ./bin/yt-dlp --version

      - name: Build renderer
        run: npm run build

      - name: Package AppImage and deb
        env:
          # No Linux signing certificate to discover; keep the build quiet.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --linux --publish never

      - name: Verify bundled backend
        shell: bash
        run: |
          set -euo pipefail
          SERVER=$(find release -type f -path '*resources/app.asar.unpacked/server/index.js' | head -1)
          test -n "$SERVER" || { echo "The packaged app has no unpacked backend."; exit 1; }
          SERVER_DIR=$(dirname "$SERVER")
          RESOURCES=$(dirname "$(dirname "$SERVER_DIR")")
          test -f "$SERVER_DIR/node_modules/express/package.json" || {
            echo "The packaged backend is missing its node_modules (express).";
            exit 1;
          }
          test -x "$RESOURCES/bin/yt-dlp" || {
            echo "The packaged app is missing its bundled yt-dlp.";
            exit 1;
          }
          echo "backend and yt-dlp present in $RESOURCES"

      - name: Verify installers
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release/*.AppImage release/*.deb
          dpkg-deb --info release/*.deb | sed -n '1,15p'
          # Written to a file rather than piped: grep -q exits on the first hit,
          # which under pipefail would fail the step on dpkg-deb's SIGPIPE.
          dpkg-deb --contents release/*.deb > deb-contents.txt
          grep -iE 'opt/[^ ]+/cloudy$|usr/bin/cloudy' deb-contents.txt
          APPIMAGE=$(ls release/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          # The AppImage runtime extracts without FUSE, so this proves it runs
          # even though the runner has no graphical session.
          "$APPIMAGE" --appimage-extract > /dev/null
          test -f squashfs-root/AppRun
          rm -rf squashfs-root

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  linux-smoke:
    name: Linux launch test (${{ matrix.os }})
    # Downloads the Linux files this run just built and starts them for real:
    # the AppImage through FUSE, then the deb through apt. Publish does not list
    # this job under `needs`, so a red result here is a warning, never a block.
    needs: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # 22.04 is the oldest supported release and 24.04 the newest, so the two
      # ends of the range are both exercised on every release.
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkg

      - name: Install a virtual display and runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool scrot lsof curl libnss3 libgbm1 libgtk-3-0
          # libfuse2 and libasound2 were both renamed in 24.04; try the old
          # spelling first and fall back to the new one.
          sudo apt-get install -y --no-install-recommends libfuse2 \
            || sudo apt-get install -y --no-install-recommends libfuse2t64
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - name: Launch both packages
        shell: bash
        run: |
          set -uo pipefail
          # apt takes a bare relative path for a package name, so hand it the
          # absolute one.
          APPIMAGE="$PWD/$(ls pkg/*.AppImage | head -1)"
          DEB="$PWD/$(ls pkg/*.deb | head -1)"
          chmod +x "$APPIMAGE"

          cat > smoke.sh <<'SH'
          # Starts one package, waits for the bundled service to answer and for a
          # window to appear, then shuts it down again.
          set -uo pipefail
          label=$1
          shift

          "$@" > "$label.log" 2>&1 &
          pid=$!
          ready=no
          wins=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:3456/health > "$label.health.json" 2>/dev/null && [ -s "$label.health.json" ]; then
              ready=yes
              break
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if [ "$ready" = yes ]; then
            for i in $(seq 1 25); do
              wins=$(xdotool search --onlyvisible --name Cloudy 2>/dev/null | wc -l)
              [ "$wins" -gt 0 ] && break
              sleep 1
            done
            scrot -o "$label.png" 2>/dev/null || true
          fi
          echo "== $label: backend=$ready windows=$wins"
          echo "health: $(cat "$label.health.json" 2>/dev/null)"
          echo "--- $label log ---"
          tail -40 "$label.log" 2>/dev/null
          kill "$pid" 2>/dev/null || true
          for i in $(seq 1 30); do
            curl -fsS --max-time 1 http://127.0.0.1:3456/health > /dev/null 2>&1 || break
            sleep 1
          done
          lsof -ti tcp:3456 2>/dev/null | xargs -r kill -TERM 2>/dev/null || true
          sleep 1
          [ "$ready" = yes ] && [ "$wins" -gt 0 ]
          SH

          status=0

          echo '::group::AppImage'
          if ! xvfb-run -a --server-args='-screen 0 1400x900x24' bash smoke.sh appimage \
               "$APPIMAGE" --no-sandbox --disable-gpu; then
            echo 'FUSE launch failed; retrying with --appimage-extract-and-run'
            xvfb-run -a --server-args='-screen 0 1400x900x24' bash smoke.sh appimage-extracted \
              "$APPIMAGE" --appimage-extract-and-run --no-sandbox --disable-gpu || status=1
          fi
          echo '::endgroup::'

          echo '::group::deb'
          if sudo apt-get install -y "$DEB"; then
            PKG=$(dpkg-deb -f "$DEB" Package)
            BIN=$(command -v cloudy || echo /opt/Cloudy/cloudy)
            cat /usr/share/applications/cloudy.desktop 2>/dev/null || echo '(no desktop entry)'
            echo "running $BIN"
            xvfb-run -a --server-args='-screen 0 1400x900x24' bash smoke.sh deb \
              "$BIN" --no-sandbox --disable-gpu || status=1
            if sudo apt-get remove -y "$PKG" > uninstall.log 2>&1; then
              echo "apt remove $PKG: ok"
              test -x /usr/bin/cloudy && echo 'the binary survived apt remove' && status=1
            else
              echo "apt remove $PKG: failed"
              cat uninstall.log
              status=1
            fi
          else
            echo 'the deb did not install'
            status=1
          fi
          echo '::endgroup::'

          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-${{ matrix.os }}
          path: |
            *.log
            *.json
            *.png
          retention-days: 14
          if-no-files-found: ignore

  publish:
    name: Publish release
    # Only a version tag publishes; a manual run just builds the installers.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes are built with git log, so the publish job needs the full
          # history and the tags that came before this one.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show installers
        run: ls -lh dist

      - name: Collect the changes since the last tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            if [ -n "$PREV" ]; then
              echo "Changes since ${PREV}:"
              echo
              git log --no-merges --pretty='- %s' "${PREV}..${VERSION}"
              echo
              echo "Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${VERSION}"
            else
              echo "First tagged release, so this is the history it ships:"
              echo
              git log --no-merges --pretty='- %s' --max-count=30 "${VERSION}"
            fi
            echo
            echo "Each of these is written up in [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/CHANGELOG.md)."
          } > changes.md
          echo "--- changes ---"
          cat changes.md

      - name: Write release notes
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          (cd dist && sha256sum ./* | sed 's| \*\./|  |') > sums.txt
          cat > release.md <<EOF
          Cloudy plays music from five catalogs in one window — YouTube Music, SoundCloud, Deezer, Apple Music and Audius — merged into a single search, with no account and no ads. Everything runs on your machine: one player, one queue, one lyrics view.

          EOF
          cat changes.md >> release.md
          cat >> release.md <<EOF

          ### Downloads

          | Platform | File |
          | --- | --- |
          | Windows 10/11 (64-bit) | \`Cloudy-${VERSION}-setup.exe\` |
          | macOS 11+ (Apple Silicon) | \`Cloudy-${VERSION}-arm64.dmg\` |
          | macOS 11+ (Intel) | \`Cloudy-${VERSION}-x64.dmg\` |
          | Linux 64-bit | \`Cloudy-${VERSION}-x86_64.AppImage\` or \`Cloudy-${VERSION}-amd64.deb\` |

          ### Installing

          **Windows** — run the installer and follow the prompts. It bundles \`yt-dlp\`, so playback works without any extra setup. The build is not code-signed yet, so SmartScreen may show "Windows protected your PC": choose **More info → Run anyway**.

          **macOS** — open the DMG and drag Cloudy into Applications. The build is not notarised, so Gatekeeper blocks the first launch: right-click the app and choose **Open**, or clear the quarantine flag once:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/Cloudy.app
          \`\`\`

          **Linux** — the AppImage runs anywhere without installing; the deb fits Debian, Ubuntu, Mint, Pop!_OS and anything else that uses apt:

          \`\`\`sh
          chmod +x Cloudy-${VERSION}-x86_64.AppImage
          ./Cloudy-${VERSION}-x86_64.AppImage

          # or, as a system package with a menu entry:
          sudo apt install ./Cloudy-${VERSION}-amd64.deb
          \`\`\`

          The AppImage needs FUSE 2 (\`libfuse2\` on Ubuntu 22.04 and newer, \`fuse2\` on Arch and Fedora). If it is not installed, extract and run it instead:

          \`\`\`sh
          ./Cloudy-${VERSION}-x86_64.AppImage --appimage-extract-and-run
          \`\`\`

          ### Checksums (SHA-256)

          \`\`\`
          EOF
          sed 's|^|  |' sums.txt >> release.md
          printf '```\n\n' >> release.md
          printf 'Requirements: Windows 10 or newer, macOS 11 or newer, or a 64-bit Linux desktop with glibc 2.35+ (Ubuntu 22.04, Debian 12, Fedora 36 or newer). Internet is needed for the first play of a track; after that it is cached locally.\n\n' >> release.md
          printf 'Documentation, build instructions and the MIT license: https://github.com/%s\n\n' "$REPO" >> release.md
          printf 'Release process: https://github.com/%s/blob/main/docs/releases.md\n' "$REPO" >> release.md
          echo '--- release notes ---'
          cat release.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Cloudy $GITHUB_REF_NAME" \
            --notes-file release.md \
            --verify-tag
